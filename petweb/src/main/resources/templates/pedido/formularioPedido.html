<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Pedidos</title>
</head>
<body class="bodyFormCad">

    <h1  class="textPrincipal">Formulário de Pedidos</h1>
    <h2 class="tituloForm">Clientes</h2>
    <datalist class="selectCad" id="listarCliente">
        <option class="optionCad" th:each="cliente : ${clientes}" 
                th:value="${cliente.idCliente} + ' - ' + cliente.nomeCliente">
        </option>
    </datalist>
    <h2 class="tituloForm">Produtos</h2>
    <datalist class="selectCad" id="listarProduto">
        <option class="optionCad" th:each="produto : ${produtos}"
                th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
                th:attr="data-preco=${produto.valorProduto}">
        </option>
    </datalist>
    <p>I. Identificação do cliente</p>
    <label for="cliente">Cliente</label>
    <input
        list="listarCliente"
        id="cliente"
        type="text"
        placeholder="Digite o nome ou código do cliente">
    <p>II.  Adicionar produto ao Pedido</p>
    <label for="produto">Produto</label>
    <input
        list="listarProduto"
        id="produto"
        type="text"
        placeholder="Digite o produto">
    
    <label for="quantidade">Quantidade</label>
    <input type="number" id="quantidade" placeholder="0" min="1">
    <button type="button" onclick="adicionarItem()">
    </button> 

    <table>
        <thead>
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço unitário</th>
            <th>Subtotal</th>
            <th>Ação</th>
        </tr>
        </thead>
        <tbody id="tabela-itens">
            <tr id="empty-row">
                <td colspan="5">Nenhum produto adicionado ao pedido</td>
            </tr>

        </tbody>
    </table>

    <span>Total do pedido</span>
    <span>R$ <span id="totalPedido">0,00</span> </span>
    <br>
    <button onclick="salvarPedido()">Confirmar e Salvar Pedido</button>

</body>
</html>
