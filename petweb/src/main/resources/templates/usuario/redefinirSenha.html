<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - PetWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body id="bodyLogin">
    <div class="container-recuperar">
        <h1 class="textPrincipal">🔐 Redefinir Senha</h1>
        <p class="textSubtitulo">Digite sua nova senha</p>

        <!-- Mensagem de Sucesso -->
        <p class="msgLogin sucesso" th:if="${mensagem}">
            ✅ <strong th:text="${mensagem}"></strong>
        </p>

        <!-- Mensagem de Erro -->
        <p class="msgLogin erro" th:if="${erro}">
            ❌ <strong th:text="${erro}"></strong>
        </p>

        <form method="post" th:action="@{/usuarios/redefinir-senha}">
            <!-- Token (Hidden) -->
            <input type="hidden" name="token" th:value="${token}" />

            <!-- Nova Senha -->
            <div class="campo-grupo">
                <label class="labelLogin" for="novaSenha">Nova Senha</label>
                <input 
                    class="inputLogin" 
                    type="password" 
                    id="novaSenha" 
                    name="novaSenha" 
                    placeholder="Digite sua nova senha"
                    minlength="6"
                    required 
                />
                <span class="toggle-password" onclick="togglePassword('novaSenha')">👁️</span>
            </div>

            <!-- Confirmar Senha -->
            <div class="campo-grupo">
                <label class="labelLogin" for="confirmarSenha">Confirmar Senha</label>
                <input 
                    class="inputLogin" 
                    type="password" 
                    id="confirmarSenha" 
                    name="confirmarSenha" 
                    placeholder="Confirme sua nova senha"
                    minlength="6"
                    required 
                />
                <span class="toggle-password" onclick="togglePassword('confirmarSenha')">👁️</span>
            </div>

            <!-- Requisitos de Senha -->
            <div class="requisitos">
                <h5>📋 Requisitos de Senha:</h5>
                <ul>
                    <li>✓ Mínimo de 6 caracteres</li>
                    <li>✓ Use letras e números</li>
                    <li>✓ Tente usar caracteres especiais (!@#$)</li>
                </ul>
            </div>

            <button class="btnEntrar" type="submit">Redefinir Senha</button>
        </form>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

        <button class="btnVoltar" style="width: 100%;">
            <a class="linkVoltar" href="/login" style="display: block;">← Voltar para Login</a>
        </button>
    </div>

    <script>
        // Função para alternar visibilidade da senha
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const type = field.type === 'password' ? 'text' : 'password';
            field.type = type;
        }

        // Validar se as senhas são iguais antes de enviar
        document.querySelector('form').addEventListener('submit', function(event) {
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            if (novaSenha !== confirmarSenha) {
                event.preventDefault();
                alert('❌ As senhas não coincidem! Digite novamente.');
                return false;
            }

            if (novaSenha.length < 6) {
                event.preventDefault();
                alert('❌ A senha deve ter no mínimo 6 caracteres!');
                return false;
            }
        });
    </script>
</body>
</html>
