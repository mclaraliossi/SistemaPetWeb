<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - PetWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body id="bodyLogin">
    <div class="container-recuperar">
        <h1 class="textPrincipal">Recuperar Senha</h1>
        <p class="textSubtitulo">Digite seu email para recuperar sua senha</p>

        <!-- Mensagem de Sucesso -->
        <p class="msgLogin sucesso" th:if="${mensagem}">
             <strong th:text="${mensagem}"></strong>
        </p>

        <!-- Mensagem de Erro -->
        <p class="msgLogin erro" th:if="${erro}">
             <strong th:text="${erro}"></strong>
        </p>

        <form method="post" th:action="@{/usuarios/solicitar-recuperacao}">
            <label class="labelLogin" for="email">Email Cadastrado</label>
            <input class="inputLogin" type="email" id="email" name="email" placeholder="seu-email@example.com" required />

            <button class="btnEntrar" type="submit">Enviar Email de Recuperação</button>
        </form>

        <div class="link-login">
            Lembrou da senha? 
            <a href="/login">Faça login aqui</a>
        </div>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #ddd;">

        <button class="btnVoltar" style="width: 100%;">
            <a class="linkVoltar" href="/petweb" style="display: block;">← Voltar para Home</a>
        </button>
    </div>
</body>
</html>
