<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
      <h1 style="text-align: center;">Cadastro de Usuários</h1>
      <form th:action="@{/usuarios/salvar}" method="post" th:object="${usuarios}">
          <input type="hidden" th:field="*{idUsuario}">
  
          <label for="nomeUsuario">Nome</label>
          <input type="text" th:field="*{nomeUsuario}">
          <br />
  
          <label for="emailUsuario">Email</label>
          <input type="text" th:field="*{emailUsuario}">
          <br />
  
          <label for="cpfUsuario">Cpf</label>
          <input type="text" th:field="*{cpfUsuario}">
          <br />
  
          <label for="telefoneUsuario">Telefone</label>
          <input type="text" th:field="*{telefoneUsuario}">
          <br />
  
          <label for="loginUsuario">Login</label>
          <input type="text" th:field="*{loginUsuario}">
          <br />
  
          <label for="senhaUsuario">Senha</label>
          <input type="password" th:field="*{senhaUsuario}">
          <br />
  
          <input type="submit" value="salvar">
      </form>
</body>
</html>
