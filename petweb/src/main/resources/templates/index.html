<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PetWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body id="bodyIndex">

    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>

    <header class="header">
        <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">PetWeb</span>
        </div>
        <div class="badge-circle">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
                <path d="M4.5 5.5c.9 0 1.6-1 1.6-2.2S5.4 1 4.5 1 2.9 2 2.9 3.3s.7 2.2 1.6 2.2zM11.5 5.5c.9 0 1.6-1 1.6-2.2S12.4 1 11.5 1s-1.6 1-1.6 2.2.7 2.2 1.6 2.2zM2.2 9.3C2.2 8 3.1 7 4.3 7c.5 0 .9.3 1.3.7.5.5 1.2.8 1.9.8s1.4-.3 1.9-.8c.4-.4.8-.7 1.3-.7 1.2 0 2.1 1 2.1 2.3 0 1.5-1.3 2.7-3 2.7-.6 0-1-.2-1.5-.4-.3-.1-.5-.2-.8-.2s-.5.1-.8.2c-.5.2-.9.4-1.5.4-1.7 0-3-1.2-3-2.7z" fill="currentColor"/>
            </svg>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <span class="hero-tag">Clínica Veterinária</span>
            <h1 class="hero-title">
                Cuidado e Carinho<br>
                para o seu <span class="hero-title-accent">Pet</span>
            </h1>
            <p class="hero-subtitle">
                Sistema de gestão para clínicas veterinárias. Agende consultas,
                acompanhe atendimentos e cuide de quem você ama.
            </p>

            <div class="hero-badges">
                <span class="pill pill-outline">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 2h5.5v5.5H2V2zm6.5 0H14v5.5H8.5V2zM2 8.5h5.5V14H2V8.5zm6.5 0H14V14H8.5V8.5z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
                    Bootstrap 5
                </span>
                <span class="pill pill-outline">CSS 3</span>
                <span class="pill pill-solid">Sistema Online</span>
            </div>
        </div>

        <div class="hero-visual">
            <div class="form-box">
                <h2 class="textSecundario">Login</h2>
                <form class="formEntrar" action="/login" method="get">
                    <button class="btnEntrar" type="submit">Entrar</button>
                </form>
                <div class="form-link">
                    <p>Não tem uma conta? <a href="/usuarios/criar">Cadastre-se</a></p>
                </div>
            </div>
            <div class="hero-card-shadow"></div>
        </div>
    </section>

</body>
</html>
