<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Veterinário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bodyListar">
        <h1 class="textPrincipal">Listagem de Veterinário</h1>
        <h3 class="textTerciario"><a th:href="@{/veterinarios/criar}">Criar novo Veterinário</a></h3>
        <table class="tabelaListar" >
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Especialidade</th>
                    <th>Telefone</th>
                    <th>CRM</th>
                    <th>CPF</th>
                    <th colspan="2">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="veterinario : ${veterinarios}">
                    <td th:text="${veterinario.nomeVeterinario}"></td>
                    <td th:text="${veterinario.especialidadeVeterinario}"></td>
                    <td th:text="${veterinario.telefoneVeterinario}"></td>
                    <td th:text="${veterinario.crmVeterinario}"></td>
                    <td th:text="${veterinario.cpfVeterinario}"></td>
                    <td>
                        <a class="linkTabelaListar" th:href="@{/veterinarios/editar/{id}(id=${veterinario.idVeterinario})}">Editar</a>
                        <a class="linkTabelaListar" th:href="@{/veterinarios/excluir/{id}(id=${veterinario.idVeterinario})}">Excluir</a>
                    </td>
    
    
                </tr>
            </tbody>
    
        </table>
        <button class="btnVoltar" ><a class="linkVoltar" href="/home">Voltar</a></button>
</body>
</html>
