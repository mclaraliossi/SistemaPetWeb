<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bodyListar">
        <h1 class="textPrincipal">Listagem de clientes</h1>
        <h3 class="textTerciario"><a th:href="@{/clientes/criar}">Criar novo cliente</a></h3>
        <table class="tabelaListar" >
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Endereço</th>
                    <th>CPF</th>
                    <th colspan="2">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.nomeCliente}"></td>
                    <td th:text="${cliente.emailCliente}"></td>
                    <td th:text="${cliente.telefoneCliente}"></td>
                    <td th:text="${cliente.enderecoCliente}"></td>
                    <td th:text="${cliente.cpfCliente}"></td>
                    <td>
                        <a class="linkTabelaListar" th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}">Editar</a>
                        <a class="linkTabelaListar" th:href="@{/clientes/excluir/{id}(id=${cliente.idCliente})}">Excluir</a>
                    </td>
    
    
                </tr>
            </tbody>
    
        </table>
        <button class="btnVoltar" ><a class="linkVoltar" href="/home">Voltar</a></button>
</body>
</html>
