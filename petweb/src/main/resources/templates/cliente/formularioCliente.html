<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bodyFormCad">
    <h1 class="textPrincipal">Cadastro de Clientes</h1>
    <form class="formCad" th:action="@{/clientes/salvar}" method="post" th:object="${cliente}">

        <h2 class="tituloForm">Formulário de Cliente</h2>
        <input class="inputCad" type="hidden" th:field="*{idCliente}">

        <label class="labelCad" for="nomeCliente">Nome:</label>
        <input class="inputCad" type="text" id="nomeCliente" th:field="*{nomeCliente}"><br><br>

        <label class="labelCad" for="emailCliente">Email:</label>
        <input class="inputCad" type="email" id="emailCliente" th:field="*{emailCliente}"><br><br>

        <label class="labelCad" for="telefoneCliente">Telefone:</label>
        <input class="inputCad" type="text" id="telefoneCliente" th:field="*{telefoneCliente}"><br><br>

        <label class="labelCad" for="enderecoCliente">Endereço:</label>
        <input class="inputCad" type="text" id="enderecoCliente" th:field="*{enderecoCliente}"><br><br>

        <label class="labelCad" for="cpfCliente">Cpf:</label>
        <input class="inputCad" type="text" id="cpfCliente" th:field="*{cpfCliente}"><br><br>

        <button class="btnSalvar" s type="submit">Salvar</button>

    </form>
    <br><br>

    <button class="btnVoltar" ><a class="linkVoltar" href="/home">Voltar</a></button>
    
</body>
</html>
